# Inside the `nope` vhost (/etc/nginx/sites-enabled/nope), before `location /`.
# Planka 2.3 supports a subpath via BASE_URL=http://138.68.226.24/collab-portal.
location = /collab-portal { return 301 /collab-portal/; }
location /collab-portal/ {
    rewrite ^/collab-portal/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /collab-portal;
}
